[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceagent"
version = "0.1.0"
description = "Forensic-grade observability and replay ledger for AI agents"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
traceagent = "traceagent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/traceagent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["traceagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
