name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-and-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" bandit build pytest-cov

      - name: Lint & Typecheck (ruff + mypy)
        run: |
          python -m ruff check src tests
          python -m mypy src

      - name: Security Scan (bandit)
        run: python -m bandit -r src -ll

      - name: Backend Tests (pytest)
        run: python -m pytest -v --cov=traceagent --cov-report=term-missing

      - name: Frontend Build Check
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build

      - name: Build Wheel & Clean Venv Smoke Test
        run: |
          python -m build --wheel
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/traceagent --help
          /tmp/smoke-venv/bin/traceagent verify --all
          /tmp/smoke-venv/bin/traceagent check --help
